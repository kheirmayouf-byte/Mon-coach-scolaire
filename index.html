<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#284b8e"><title>Mon Coach Scolaire</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#20304d;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#284b8e;color:white;padding:18px}main{max-width:950px;margin:auto;padding:18px}h1{font-size:1.5rem;margin:0}h2{font-size:1.2rem}.muted{color:#63718b}.panel{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 14px #20304d10}button,select,input,textarea{font:inherit}button{cursor:pointer;background:#284b8e;color:white;border:0;border-radius:10px;padding:11px 15px}button.secondary{background:#e8eef9;color:#284b8e}button.active{background:#17315e}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;margin:10px 0 4px}input,select,textarea{border:1px solid #bbc5d5;border-radius:9px;padding:10px;width:100%;background:white}textarea{min-height:100px}.task{border-top:1px solid #e1e6f0;padding:13px 0;display:flex;align-items:start;gap:10px}.task input{width:auto;margin-top:6px}.task div{flex:1}.small{font-size:.86rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pill{background:#e8eef9;color:#284b8e;border-radius:20px;padding:4px 9px;font-size:.8rem}#notice{color:#975d08}button:focus-visible,input:focus-visible{outline:3px solid #efb845}footer{padding:25px;text-align:center;color:#64718b;font-size:.8rem}
</style></head><body><header><div style="max-width:950px;margin:auto"><h1>📚 Mon Coach Scolaire</h1><p style="margin:5px 0">Organiser, réviser, progresser ensemble</p></div></header><main>
<section class="panel"><label for="profile">Espace affiché</label><select id="profile"><option value="parents">👨‍👩‍👧‍👧 Parents</option><option value="noor">🌟 Noor</option><option value="bettina">🌼 Bettina</option></select><p class="muted small">Prototype sans connexion sécurisée : les profils sont des vues, pas des comptes privés.</p><nav><button data-tab="dashboard" class="active">Tableau de bord</button><button data-tab="tasks">Devoirs</button><button data-tab="planning">Planning</button><button data-tab="quiz">Quiz</button><button data-tab="import">Importer</button></nav></section>
<div id="notice" aria-live="polite"></div><div id="content"></div>
</main><footer>Version de démonstration · Données enregistrées uniquement sur cet appareil</footer>
<script>
(function(){
"use strict";
const KEY="mon-coach-scolaire-v1";
let memory={tasks:[],scores:[]},persistent=false;
try{const test="__mcs_test";localStorage.setItem(test,"1");localStorage.removeItem(test);persistent=true;const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&Array.isArray(saved.tasks))memory=saved}catch(e){}
let tab="dashboard",profile="parents";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toLocaleDateString("en-CA");
function save(){if(persistent){try{localStorage.setItem(KEY,JSON.stringify(memory))}catch(e){persistent=false;message("Stockage indisponible : les modifications ne seront pas conservées après fermeture.")}}}
function message(s){$("notice").textContent=s}
function visible(){return memory.tasks.filter(t=>profile==="parents"||t.child===profile)}
function childName(c){return c==="noor"?"Noor":"Bettina"}
function taskHtml(t){return '<div class="task"><input aria-label="Terminer le devoir" type="checkbox" data-check="'+esc(t.id)+'" '+(t.done?"checked":"")+'><div><strong>'+esc(t.subject)+'</strong> <span class="pill">'+childName(t.child)+'</span><p>'+esc(t.description)+'</p><div class="muted small">Donné le '+esc(t.given)+' · Pour le '+esc(t.due)+'</div></div><button class="secondary" data-delete="'+esc(t.id)+'">Supprimer</button></div>'}
function dashboard(){const tasks=visible();const todo=tasks.filter(t=>!t.done);return '<section class="panel"><h2>Bienvenue '+(profile==="parents"?"dans l’espace parents":childName(profile))+'</h2><div class="grid"><div><strong>'+tasks.length+'</strong><p>Devoirs enregistrés</p></div><div><strong>'+todo.length+'</strong><p>Devoirs à faire</p></div><div><strong>'+memory.scores.filter(s=>profile==="parents"||s.child===profile).length+'</strong><p>Quiz réalisés</p></div></div></section><section class="panel"><h2>Prochaines échéances</h2>'+(todo.length?todo.sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5).map(taskHtml).join(""):'<p class="muted">Aucun devoir en attente. Ajoute les devoirs depuis l’onglet Devoirs.</p>')+'</section>'}
function tasksView(){return '<section class="panel"><h2>Devoirs</h2>'+(visible().length?visible().slice().sort((a,b)=>a.due.localeCompare(b.due)).map(taskHtml).join(""):'<p>Aucun devoir enregistré.</p>')+'</section><section class="panel"><h2>Ajouter un devoir</h2><form id="taskForm"><label>Enfant</label><select name="child">'+(profile==="parents"?'<option value="noor">Noor</option><option value="bettina">Bettina</option>':'<option value="'+profile+'">'+childName(profile)+'</option>')+'</select><label>Matière</label><input name="subject" required maxlength="80" placeholder="Mathématiques"><label>Consigne</label><textarea name="description" required placeholder="Exercices à faire ou leçon à apprendre"></textarea><div class="grid"><div><label>Date donnée</label><input type="date" name="given" required value="'+today()+'"></div><div><label>Date d’échéance</label><input type="date" name="due" required value="'+today()+'"></div></div><p><button type="submit">Ajouter le devoir</button></p></form></section>'}
function planning(){const t=visible().filter(x=>!x.done).sort((a,b)=>a.due.localeCompare(b.due));return '<section class="panel"><h2>Planning par échéance</h2><p class="muted">Les devoirs sont classés par date limite. Une date de réalisation ne doit jamais précéder la date donnée.</p>'+(t.length?t.map(taskHtml).join(""):'<p>Aucune tâche à planifier.</p>')+'</section><section class="panel"><h2>Créneaux familiaux de référence</h2><p>Lundi : étude Parkours une semaine sur deux · Mardi et jeudi : étude · Mercredi après 17 h 40 : 30–40 min · Vendredi vers 18 h · Samedi et dimanche matin · Vacances : 30 min le matin.</p><p class="muted">La répartition automatique dans les créneaux sera développée dans une version ultérieure.</p></section>'}
const questions=[{q:"Quel est le passé simple de « il faire » ?",a:["il faisait","il fit","il fera"],ok:1,why:"Au passé simple, faire devient « il fit »."},{q:"Dans un circuit électrique simple, que faut-il pour que la lampe s’allume ?",a:["Un circuit fermé","Un circuit ouvert","Un seul fil"],ok:0,why:"Le courant circule lorsque le circuit est fermé."},{q:"En anglais, « apple » signifie :",a:["Pain","Pomme","Eau"],ok:1,why:"Apple signifie pomme."}];
function quiz(){return '<section class="panel"><h2>Mini-quiz</h2><p class="muted">Trois questions de démonstration, sans adaptation automatique à une leçon.</p><form id="quizForm">'+questions.map((q,i)=>'<fieldset style="border:1px solid #e1e6f0;border-radius:10px;margin:12px 0"><legend><strong>'+(i+1)+'. '+esc(q.q)+'</strong></legend>'+q.a.map((a,j)=>'<label><input style="width:auto" type="radio" required name="q'+i+'" value="'+j+'"> '+esc(a)+'</label>').join("")+'</fieldset>').join("")+'<button type="submit">Corriger mes réponses</button></form><div id="quizResult" aria-live="polite"></div></section>'}
function importView(){return '<section class="panel"><h2>Importer des devoirs</h2><p>Colle une ligne par devoir au format : <strong>Enfant | Matière | Date donnée | Date limite | Consigne</strong></p><p class="muted small">Exemple : Noor | Français | 2026-11-08 | 2026-11-17 | Réviser le passé simple</p><textarea id="importText" placeholder="Noor | Français | 2026-11-08 | 2026-11-17 | Réviser le passé simple"></textarea><p><button id="importButton">Vérifier et importer</button></p><p class="muted">Les captures d’écran et les copier-coller libres nécessiteront une analyse intelligente dans une version ultérieure.</p></section>'}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("content").innerHTML=({dashboard, tasks:tasksView,planning,quiz,import:importView}[tab])()}
document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;message("");render()}});
$("profile").addEventListener("change",e=>{profile=e.target.value;render()});
$("content").addEventListener("change",e=>{if(e.target.dataset.check){const t=memory.tasks.find(t=>t.id===e.target.dataset.check);if(t){t.done=e.target.checked;save();render()}}});
$("content").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.delete){memory.tasks=memory.tasks.filter(t=>t.id!==b.dataset.delete);save();render()}if(b.id==="importButton"){const lines=$("importText").value.trim().split(/\n/).filter(Boolean);let added=0,errors=[];lines.forEach((line,i)=>{const p=line.split("|").map(x=>x.trim());const child=/^noor$/i.test(p[0])?"noor":/^bettina$/i.test(p[0])?"bettina":null;if(p.length<5||!child||!/^\d{4}-\d{2}-\d{2}$/.test(p[2])||!/^\d{4}-\d{2}-\d{2}$/.test(p[3])||p[3]<p[2]||!p[1]||!p[4]){errors.push(i+1);return}memory.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+i),child,subject:p[1],given:p[2],due:p[3],description:p.slice(4).join(" | "),done:false});added++});save();message(added+" devoir(s) importé(s)."+(errors.length?" Lignes à corriger : "+errors.join(", "):""));if(added){tab="tasks";render()}}});
$("content").addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="taskForm"){const f=new FormData(e.target);if(f.get("due")<f.get("given")){message("La date limite doit être postérieure ou égale à la date donnée.");return}memory.tasks.push({id:String(Date.now())+Math.random(),child:f.get("child"),subject:f.get("subject"),description:f.get("description"),given:f.get("given"),due:f.get("due"),done:false});save();message("Devoir ajouté.");render()}if(e.target.id==="quizForm"){const f=new FormData(e.target);let score=0;questions.forEach((q,i)=>{if(Number(f.get("q"+i))===q.ok)score++});memory.scores.push({child:profile==="parents"?"noor":profile,score,total:questions.length,date:today()});save();$("quizResult").innerHTML='<h3>Résultat : '+score+'/'+questions.length+'</h3>'+questions.map((q,i)=>'<p>'+esc(q.why)+'</p>').join("")}});
if(!persistent)message("Mode temporaire : Safari ne permet pas ici de conserver les données après fermeture.");
render();
})();
</script></body></html>
