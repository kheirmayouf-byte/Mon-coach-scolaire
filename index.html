<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#284b8e"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Mon Coach Scolaire</title><link rel="stylesheet" href="style.css?v=3.3.0"><script defer src="app.js?v=3.3.0"></script></head>
<body><header><div><p class="eyebrow">LE PETIT PAS DU JOUR</p><h1>📚 Mon Coach Scolaire</h1><p>Organiser, réviser, progresser ensemble</p><div id="identity" class="identity"></div></div><div id="sessionDock" class="header-session"></div></header>
<main><section class="panel coach-panel" id="coachPanel"><div class="coach-heading"><strong>Ton coach, à portée de question</strong><small id="coachMode">Aide de l’application · mode local</small></div><label class="sr-only" for="coachQuestion">Pose ta question</label><div class="coach-compose"><input id="coachQuestion" maxlength="2000" placeholder="Une question sur un devoir, le planning ou un exercice ?"><button data-x="ask">Demander</button><button data-x="dictate" class="secondary" aria-label="Dicter une question">Micro</button><button data-x="speak-answer" class="secondary">Écouter</button></div><p id="coachAnswer" class="coach-answer" role="status"></p></section><section class="panel toolbar"><div><label for="profile">Mon espace</label><select id="profile"></select></div><div id="connection" aria-live="polite"></div></section>
<nav aria-label="Navigation principale"><button data-tab="dashboard">Vue d’ensemble</button><button data-tab="tasks">Devoirs</button><button data-tab="planning">Mon planning</button><button data-tab="revision">Révisions</button><button data-tab="import">Importer / actualiser</button><button data-tab="documents">Documents</button><button data-tab="settings">Parents & connexion</button></nav>
<p id="notice" role="status" aria-live="polite"></p><div id="content"></div><div id="modalHost"></div></main>
<footer>Version 3.3.0 · Les espaces enfants sont des vues accompagnées du compte parent, pas des comptes séparés.</footer></body></html>
